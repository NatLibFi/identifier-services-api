type: object
properties:
  form:
    type: object
    properties:
      publisher:
        type: string
        maximum: 100
      contact_person:
        type: string
        maximum: 100
      email:
        type: string
        maximum: 100
      phone:
        type:
          - string
          - 'null'
        maximum: 30
      address:
        type:
          - string
          - 'null'
        maximum: 50
      zip:
        type:
          - string
          - 'null'
        maximum: 10
      city:
        type:
          - string
          - 'null'
        maximum: 50
      lang_code:
        $ref: '../../../enums/lang-code.yaml'
    required:
      - publisher
      - contact_person
      - email
      - lang_code
  publications:
    type: array
    minItems: 1
    maxItems: 4
    items:
      type: object
      properties:
        title:
          type: string
          maximum: 200
        subtitle:
          type:
            - string
            - 'null'
          maximum: 200
        place_of_publication:
          type:
            - string
            - 'null'
          maximum: 100
        printer:
          type:
            - string
            - 'null'
          maximum: 100
        issued_from_year:
          $ref: '../../../patterns/year-string.yaml'
        issued_from_number:
          type:
            - string
            - 'null'
          maximum: 100
        frequency:
          $ref: '../../../enums/serial/serial-publication-frequency.yaml'
        frequency_other:
          type:
            - string
            - 'null'
          maximum: 50
        language:
          $ref: '../../../enums/item-language.yaml'
        publication_type:
          $ref: '../../../enums/serial/serial-publication-type.yaml'
        publication_type_other:
          type:
            - string
            - 'null'
          maximum: 50
        medium:
          $ref: '../../../enums/serial/serial-publication-medium.yaml'
        medium_other:
          type:
            - string
            - 'null'
          maximum: 50
        url:
          type: string
          maximum: 100
        previous:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                maximum: 100
              issn:
                $ref: '../../../patterns/issn-identifier.yaml'
              last_issue:
                type: string
                maximum: 50
        main_series:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                maximum: 100
              issn:
                $ref: '../../../patterns/issn-identifier.yaml'
        subseries:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                maximum: 100
              issn:
                $ref: '../../../patterns/issn-identifier.yaml'
        another_medium:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                maximum: 100
              issn:
                $ref: '../../../patterns/issn-identifier.yaml'
        additional_info:
          type:
            - string
            - 'null'
          maximum: 2000
      required:
        - title
  turnstile_token:
    type: string
required:
  - form
  - publications
