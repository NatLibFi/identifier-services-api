type: object
properties:
  form:
    type: object
    properties:
      publisher:
        type: string
        maximum: 100
      contact_person:
        type: string
        maximum: 100
      email:
        type: string
        maximum: 100
      phone:
        type:
          - string
          - 'null'
        maximum: 30
      address:
        type:
          - string
          - 'null'
        maximum: 50
      zip:
        type:
          - string
          - 'null'
        maximum: 10
      city:
        type:
          - string
          - 'null'
        maximum: 50
      lang_code:
        $ref: '../../../enums/lang-code.yaml'
    required:
      - publisher
      - contact_person
      - email
      - lang_code
  publications:
    type: array
    minItems: 1
    maxItems: 4
    items:
      $ref: '../serial-publication/serial-publication-create-body.yaml'
  turnstile_token:
    type: string
required:
  - form
  - publications
