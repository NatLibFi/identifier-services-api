type: object
properties:
  statistics_type:
    type: string
    enum:
      - ISSN
      - PUBLISHERS
      - PUBLICATIONS
      - FORMS
  output_format:
    type: string
    enum:
      - CSV
      - XLSX
  begin:
    type: string
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
  end:
    type: string
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
required:
  - statistics_type
  - output_format
