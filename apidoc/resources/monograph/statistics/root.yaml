post:
  operationId: createMonographStatistics
  summary: Create statistics CSV/XLSX regarding monographs
  security:
    - openId:
        - admin
  description: Creates statistics CSV/XLSX regarding monograph.
  tags:
    - monograph
    - monograph-statistics
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../schemas/requests/monograph/statistics/monograph-statistics-create-body.yaml'
  responses:
    '200':
      description: Statistics CSV/XLSX file was created successfully
      content:
        text/csv:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '409':
      description: Conflict
    '422':
      description: Unprocessable entity
    default:
      $ref: '../../../responses/error.yaml'
