post:
  operationId: cancelApproveMonographPublisherRequest
  summary: Cancels approval of monograph publisher request and transfers the publisher from publisher registry back to request.
  security:
    - openId:
        - admin
  tags:
    - monograph
    - monograph-publisher
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '200':
      description: Cancellation of approval was successful, new request was created from the entry and its ID is returned
      content:
        application/json:
          schema:
            $ref: '../../../schemas/responses/common/created.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '409':
      description: Conflict
    '422':
      description: Unprocessable entity
    default:
      $ref: '../../../responses/error.yaml'
