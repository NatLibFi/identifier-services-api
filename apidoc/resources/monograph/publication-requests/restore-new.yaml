post:
  operationId: restoreMonographPublicationRequestToNew
  summary: Restores monograph publication request to new state. May only be used if the publication is IN_PROCESS state.
  security:
    - openId:
        - admin
  tags:
    - monograph
    - monograph-publication-request
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '204':
      description: State restoration to new was successful
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '409':
      description: Conflict
    '422':
      description: Unprocessable entity
    default:
      $ref: '../../../responses/error.yaml'
