# Using HTTP POST mainly for turnstile token since we don't yet have HTTP QUERY (i.e., GET requests with body)
post:
  operationId: downloadMonographIdentifierBattch
  summary: Download ISBN/ISMN identifiers associated with batch id given as parameter as text file
  security: []
  tags:
    - monograph
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            turnstile_token:
              type: string
          required:
            - turnstile_token
  responses:
    '200':
      description: Ok
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '409':
      description: Conflict
    default:
      $ref: '../../../responses/error.yaml'
