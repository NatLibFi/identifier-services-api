get:
  operationId: readMonographIdentifierBatch
  summary: Read monograph identifier batch information that is public
  security: []
  tags:
    - monograph
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '200':
      description: Ok
      content:
        application/json:
          schema:
            $ref: '../../../schemas/responses/monograph/monograph-identifier-batch-public.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '409':
      description: Conflict
    default:
      $ref: '../../../responses/error.yaml'

delete:
  operationId: deleteMonographIdentifierBatch
  summary: Delete monograph identifier batch and deassign associated identifiers
  security:
    - openId:
        - admin
  tags:
    - monograph
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '204':
      description: Resource was deleted
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '409':
      description: Conflict
    default:
      $ref: '../../../responses/error.yaml'
