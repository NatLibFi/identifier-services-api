post:
  operationId: searchMonographMessage
  summary: Search a message related to monograph operations
  description: You need to define exactly one of the following properties -> monograph_publisher_id, monograph_publication_request_id, or search_text
  security:
    - openId:
        - admin
  tags:
    - monograph
    - monograph-messages
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../schemas/requests/monograph/message/search-monograph-message-body.yaml'
  responses:
    '200':
      description: Ok
      content:
        application/json:
          schema:
            $ref: '../../../schemas/responses/monograph/monograph-message-search-response.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    default:
      $ref: '../../../responses/error.yaml'
