post:
  operationId: createFromTemplate
  summary: Create message information by using a message template stored to database
  security:
    - openId:
        - admin
  tags:
    - monograph
    - monograph-messages
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../schemas/requests/monograph/message/create-from-template-body.yaml'
  responses:
    '200':
      description: Ok
      content:
        application/json:
          schema:
            $ref: '../../../schemas/responses/monograph/message-template-loaded.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: One or more associated entitites could not be found
    '409':
      description: Conflict
    '422':
      description: Unprocessable Entity
    default:
      $ref: '../../../responses/error.yaml'
