post:
  operationId: approveMonographPublisherRequest
  summary: Approve monograph publisher request and make the publisher part of publisher registry.
  security:
    - openId:
        - admin
  tags:
    - monograph
    - monograph-publisher-request
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '204':
      description: Approval was successful
      content:
        application/json:
          schema:
            $ref: '../../../schemas/responses/monograph/monograph-publisher-request-approve-response.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '409':
      description: Conflict
    '422':
      description: Unprocessable entity
    default:
      $ref: '../../../responses/error.yaml'
