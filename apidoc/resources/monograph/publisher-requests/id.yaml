get:
  operationId: readMonographPublisherRequest
  summary: Read monograph publisher request information.
  security:
    - openId:
        - admin
  tags:
    - monograph
    - monograph-publisher-request
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '200':
      description: Resource was read
      content:
        application/json:
          schema:
            $ref: '../../../schemas/responses/monograph/monograph-publisher-request.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '422':
      description: Unprocessable entity
    default:
      $ref: '../../../responses/error.yaml'

patch:
  operationId: updateMonographPublisherRequest
  summary: Update monograph publisher request information.
  security:
    - openId:
        - admin
  tags:
    - monograph
    - monograph-publisher-request
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../schemas/requests/monograph/monograph-publisher-request/monograph-publisher-request-update-body.yaml'
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '204':
      description: Resource was updated
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '409':
      description: Conflict
    '422':
      description: Unprocessable entity
    default:
      $ref: '../../../responses/error.yaml'

delete:
  operationId: deleteMonographPublisherRequest
  summary: Delete monograph publisher request. This will remove both the request and the associated archive entry.
  security:
    - openId:
        - admin
  tags:
    - monograph
    - monograph-publisher-request
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '204':
      description: Deletion was successful
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '409':
      description: Conflict
    '422':
      description: Unprocessable entity
    default:
      $ref: '../../../responses/error.yaml'
