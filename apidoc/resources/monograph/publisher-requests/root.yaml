post:
  operationId: createMonographPublisherRequest
  summary: Create a new monograph publisher request
  security: []
  tags:
    - monograph
    - monograph-publisher-request
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - $ref: '../../../schemas/requests/monograph/monograph-publisher-request/monograph-publisher-request-create-v1.yaml'
            - $ref: '../../../schemas/requests/monograph/monograph-publisher-request/monograph-publisher-request-create-v2.yaml'
  responses:
    '201':
      description: Resource was created
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '409':
      description: Conflict
    '422':
      description: Unprocessable Entity
    default:
      $ref: '../../../responses/error.yaml'
