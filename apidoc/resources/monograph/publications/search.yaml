post:
  operationId: searchMonographPublication
  summary: Search a monograph publication
  security:
    - openId:
        - admin
  tags:
    - monograph
    - monograph-publication
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../schemas/requests/monograph/monograph-publication/monograph-publication-search-body.yaml'
  responses:
    '200':
      description: Ok
      content:
        application/json:
          schema:
            type: object
            properties:
              total_doc:
                type: number
              results:
                type: array
                items:
                  allOf:
                    - $ref: '../../../schemas/responses/monograph/monograph-publication.yaml'
                    - type: object
                      properties:
                        monograph_publication_request_id:
                          type:
                            - number
                            - 'null'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '409':
      description: Conflict
    '422':
      description: Unprocessable Entity
    default:
      $ref: '../../../responses/error.yaml'
