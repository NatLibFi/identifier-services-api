get:
  operationId: readIsmnPublisherRangePublicInfo
  summary: Read ISMN publisher range public information (used for Public UI identifier download page)
  security: []
  tags:
    - monograph
    - ismn-publisher-range
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '200':
      description: Resource was read
      content:
        application/json:
          schema:
            $ref: '../../../schemas/responses/monograph/publisher-range-read.yaml'
    '404':
      description: Resource was not found
    '422':
      description: Unprocessable entity
    default:
      $ref: '../../../responses/error.yaml'

delete:
  operationId: deleteIsmnPublisherRange
  summary: Delete ISMN publisher range
  security:
    - openId:
        - admin
  tags:
    - monograph
    - ismn-publisher-range
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '204':
      description: Resource was deleted
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '409':
      description: Conflict
    default:
      $ref: '../../../responses/error.yaml'
