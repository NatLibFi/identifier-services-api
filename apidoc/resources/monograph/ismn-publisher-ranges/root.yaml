post:
  operationId: createIsmnPublisherRange
  summary: Create a new ISMN publisher range
  security:
    - openId:
        - admin
  description: Creates a new ISMN publisher range with associations to ISMN range and monograph publisher.
  tags:
    - monograph
    - ismn
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../schemas/requests/monograph/ismn-publisher-range/ismn-publisher-range-create-body.yaml'
  responses:
    '201':
      description: Resource was created
      content:
        application/json:
          schema:
            $ref: '../../../schemas/responses/common/created.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '409':
      description: Conflict
    '422':
      description: Unprocessable Entity
    default:
      $ref: '../../../responses/error.yaml'
