get:
  operationId: readSerialPublicationRequest
  summary: Read serial publication request information.
  security:
    - openId:
        - admin
  tags:
    - serial
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '200':
      description: Resource was read
      content:
        application/json:
          schema:
            $ref: '../../../schemas/responses/serial/serial-publication-request.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '422':
      description: Unprocessable entity
    default:
      $ref: '../../../responses/error.yaml'

patch:
  operationId: updateSerialPublicationRequest
  summary: Update serial publication request
  security:
    - openId:
        - admin
  tags:
    - serial
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../schemas/requests/serial/serial-publication-request/serial-publication-request-update-body.yaml'
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '200':
      description: Resource was updated
      content:
        application/json:
          schema:
            $ref: '../../../schemas/responses/serial/serial-publication-request-lite.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '409':
      description: Conflict
    '422':
      description: Unprocessable entity
    default:
      $ref: '../../../responses/error.yaml'

delete:
  operationId: deleteSerialPublicationRequest
  summary: Delete serial publication request
  security:
    - openId:
        - admin
  tags:
    - serial
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '204':
      description: Resource was deleted
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '409':
      description: Conflict
    default:
      $ref: '../../../responses/error.yaml'
