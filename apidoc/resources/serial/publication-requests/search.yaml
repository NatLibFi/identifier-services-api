post:
  operationId: searchSerialPublicationRequest
  summary: Search serial publication requests
  security:
    - openId:
        - admin
  tags:
    - serial
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../schemas/requests/serial/publication-request/serial-publication-request-search-body.yaml'
  responses:
    '200':
      description: Ok
      content:
        application/json:
          schema:
            type: object
            properties:
              total_doc:
                type: number
              results:
                type: array
                items:
                  $ref: '../../../schemas/responses/serial/serial-publication-request-search-result.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '409':
      description: Conflict
    '422':
      description: Unprocessable Entity
    default:
      $ref: '../../../responses/error.yaml'
