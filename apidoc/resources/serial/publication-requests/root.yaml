post:
  operationId: createSerialpublicationRequest
  summary: Create a new serial publication request
  security: []
  tags:
    - serial
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - $ref: '../../../schemas/requests/serial/publication-request/serial-publication-request-create-body-v1.yaml'
            - $ref: '../../../schemas/requests/serial/publication-request/serial-publication-request-create-body-v2.yaml'
  responses:
    '201':
      description: Resource was created
      content:
        application/json:
          schema:
            $ref: '../../../schemas/responses/common/created.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '409':
      description: Conflict
    '422':
      description: Unprocessable Entity
    default:
      $ref: '../../../responses/error.yaml'
