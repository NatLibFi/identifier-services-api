post:
  operationId: sendSerialMessage
  summary: Send a message regarding serial operations to a publisher
  security:
    - openId:
        - admin
  tags:
    - serial
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../schemas/requests/serial/message/send-serial-message-body.yaml'
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: '../../../schemas/responses/common/created.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: One or more associated entitites could not be found
    '409':
      description: Conflict
    '422':
      description: Unprocessable Entity
    default:
      $ref: '../../../responses/error.yaml'
