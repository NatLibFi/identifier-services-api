post:
  operationId: createSerialPublicationExpressionMarc
  summary: Create MARC record from serial publication information.
  security:
    - openId:
        - admin
  tags:
    - serial
    - metadata
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../schemas/requests/serial/serial-publication/serial-publication-marc-create-body.yaml'
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '200':
      description: MARC record created successfully
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
        text/plain:
          schema:
            type: string
        application/octet-stream:
          schema:
            type: string
            format: binary
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '409':
      description: Conflict
    '422':
      description: Unprocessable entity
    default:
      $ref: '../../../responses/error.yaml'
