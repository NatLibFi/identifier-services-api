patch:
  operationId: updateIssnRange
  summary: Update ISSN range
  security:
    - openId:
        - admin
  tags:
    - serial
    - issn
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../schemas/requests/serial/issn-range/issn-range-update-body.yaml'
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '204':
      description: Resource was updated
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '409':
      description: Conflict
    '422':
      description: Unprocessable entity
    default:
      $ref: '../../../responses/error.yaml'

delete:
  operationId: deleteIssnRange
  summary: Delete ISSN range
  security:
    - openId:
        - admin
  tags:
    - serial
    - issn
  parameters:
    - $ref: '../../../parameters/path/id.yaml'
  responses:
    '204':
      description: Resource was deleted
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Resource was not found
    '409':
      description: Conflict
    default:
      $ref: '../../../responses/error.yaml'
