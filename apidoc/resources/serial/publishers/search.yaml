post:
  operationId: searchSerialPublisher
  summary: Create a serial publishers
  security: []
  tags:
    - serial
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../schemas/requests/serial/serial-publisher/serial-publisher-search-body.yaml'
  responses:
    '200':
      description: Ok
      content:
        application/json:
          schema:
            type: object
            properties:
              total_doc:
                type: number
              results:
                type: array
                items:
                  $ref: '../../../schemas/responses/serial/serial-publisher-search.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '409':
      description: Conflict
    '422':
      description: Unprocessable Entity
    default:
      $ref: '../../../responses/error.yaml'
